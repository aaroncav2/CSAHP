 C2.innerHTML=T.map(([g,k,t])=>`<h3>${esc(t)}</h3><table class="t cu">${tbl(g,k)}</table>`).join('');glob();dia()}
$('cum').onclick=e=>{const b=e.target.closest('.x');if(b){(+b.dataset.g<0?P:C[+b.dataset.g]).rows.splice(+b.dataset.i,1);cum()}};
function glob(){const E=$('glob');if(!P.rows.length){E.innerHTML='<small>Add perspective data first.</small>';return}
 const mean=g=>[...Array(g.n)].map((_,k)=>g.rows.reduce((s,r)=>s+r.avg[k],0)/g.rows.length),pm=mean(P),B=[];
 pm.forEach((pv,k)=>{const c=C[k];if(c&&c.rows.length)mean(c).forEach((lw,i)=>B.push({p:i?'':pname(k),v:i?null:pv,c:c.desc[i]||'Criterion '+Lt(i),l:lw,g:pv*lw}));else B.push({p:pname(k),v:pv,c:'(no criteria data yet)',l:null,g:null})});
 const gs=B.filter(r=>r.g!=null).map(r=>r.g),mn=Math.min(...gs),mx=Math.max(...gs),R=[248,105,107],Y=[255,235,132],Gn=[99,190,123],mixc=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t)),
 col=x=>{const t=mx>mn?(x-mn)/(mx-mn):.5,c=t<.5?mixc(R,Y,t*2):mixc(Y,Gn,(t-.5)*2);return`style="background:rgb(${c});color:#000"`};
 const sm=a=>a.reduce((x,y)=>x+y,0);
 E.innerHTML=`<table class="t gt"><tr><th>Perspectives</th><th>Value</th><th>Criterion</th><th>Local Weights</th><th>Global Weights</th></tr>`+B.map(r=>`<tr><td style="text-align:left">${esc(r.p)}</td><td>${r.v==null?'':tr(r.v)}</td><td>${esc(r.c)}</td><td>${r.l==null?'':tr(r.l)}</td><td ${r.g==null?'':col(r.g)}>${r.g==null?'':f2(r.g)}</td></tr>`).join('')+
 `<tr class="tot"><td style="text-align:left">Total</td><td>${tr(sm(pm))}</td><td></td><td>${tr(sm(B.filter(r=>r.l!=null).map(r=>r.l)))}</td><td>${tr(sm(gs))}</td></tr></table>`}
function dia(){const E=$('dia');if(!P.rows.length){E.innerHTML='<small>The chart appears after perspective data is added.</small>';return}
 const mean=g=>[...Array(g.n)].map((_,k)=>g.rows.reduce((s,r)=>s+r.avg[k],0)/g.rows.length),
 chip=(a,i)=>{const r=a.map(x=>+x.toFixed(2)),mx=Math.max(...r),mn=Math.min(...r),c=mx==mn?'':r[i]==mx?'hi':r[i]==mn?'lo':'';return`<div class="chip ${c}">${r[i].toFixed(2).replace(/^0/,'')}</div>`},pm=mean(P);
 let h=`<div class="mis">${esc($('mt').value||'Mission')}</div><div class="dcols">`;
 pm.forEach((_,k)=>{h+=`<div class="dc">${chip(pm,k)}<div class="per">${esc(pname(k))}</div>`;const c=C[k];
  if(c&&c.rows.length){const cm=mean(c);cm.forEach((_,i)=>{h+=`${chip(cm,i)}<div class="cri">${esc(c.desc[i]||'Criterion '+Lt(i))}</div>`})}else h+='<small>(no criteria data yet)</small>';h+='</div>'});
 E.innerHTML=h+'</div>'}
$('mt').oninput=dia;build();
</script></body></html>
