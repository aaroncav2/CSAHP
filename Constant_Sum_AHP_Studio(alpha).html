<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c34">
  <meta name="description" content="An offline Constant Sum Analytic Hierarchy Process (Constant Sum AHP) workspace for individual and group decision modeling.">
  <title>Constant Sum AHP Studio — Decision Modeling Workspace</title>
  <style>
:root{--navy:#152039;--navy-dark:#0e172a;--indigo:#525fea;--indigo-dark:#3d4acc;--teal:#078f8e;--ink:#1b2540;--muted:#69758c;--border:#e1e7f1;--surface:#fff;--bg:#f5f7fb;--soft:#eff2fe;--warn:#a56b0c;--warn-bg:#fff7e7;--good:#16755d;--good-bg:#e6f6ef;--radius:17px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.56 'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b6baff;outline-offset:2px}
a{color:var(--indigo)}
.loading{margin:20vh auto;text-align:center;font-size:27px;color:var(--muted)}
.shell{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:100vh}
.sidebar{background:linear-gradient(165deg,#17233d 0%,#101a2f 76%);color:#f5f7ff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:17px 14px 13px;z-index:10}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 13px;border-bottom:1px solid #ffffff1b}
.brand-mark{width:39px;height:39px;background:#6e7df6;border-radius:12px;display:grid;place-items:center;box-shadow:0 8px 24px #4654e24c}
.brand-mark svg{display:block}
.brand strong{display:block;font-size:21px;line-height:1.12;letter-spacing:-.6px;font-family:Manrope,sans-serif}
.brand small{display:block;color:#aab9d9;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
.sidebar-label{padding:15px 11px 5px;color:#8594b0;font-weight:800;font-size:13.5px;letter-spacing:.17em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{border:0;background:transparent;border-radius:10px;width:100%;padding:8px 11px;color:#b9c4d9;text-align:left;display:flex;align-items:center;gap:13px;font-weight:600;transition:.14s}
.nav button:hover{background:#ffffff10;color:white}
.nav button.active{background:#6d7df329;color:#fff;box-shadow:inset 3px 0 0 #91a0ff}
.nav .nav-glyph{width:19px;text-align:center;font-size:20px;font-weight:500;color:inherit;opacity:.9}
.nav .mini-dot{background:#a5b0d4;width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px}
.sidebar-spacer{flex:1}
.sidebar-foot{margin:9px 5px 0;padding:9px 11px;border:1px solid #a4b1d72b;border-radius:13px;background:#fff1}
.sidebar-foot .tiny-status{font-weight:700;color:#e3eafa;font-size:15.5px;display:flex;gap:9px;align-items:center}
.sidebar-foot p{margin:6px 0 0;color:#a4b0cc;font-size:14.5px;line-height:1.5}
.live-dot{display:inline-block;width:7px;height:7px;background:#5bc5ab;border-radius:50%;box-shadow:0 0 0 3px #5bc5ab25}
.main{min-width:0}
.topbar{min-height:72px;border-bottom:1px solid var(--border);background:#ffffffcd;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px clamp(21px,4.1vw,55px);backdrop-filter:blur(10px)}
.crumb{font-weight:700;color:#6b778e;font-size:15.5px}
.topactions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.content{max-width:1380px;margin:0 auto;padding:33px clamp(21px,4.1vw,55px) 70px}
.eyebrow{font-size:13.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--indigo);font-weight:800;margin-bottom:10px}
.hero{display:flex;align-items:start;justify-content:space-between;gap:18px;margin-bottom:26px}
.hero h1{font-family:Manrope,'DM Sans',sans-serif;letter-spacing:-1.4px;font-size:clamp(31px,3.05vw,41px);line-height:1.2;margin:0;font-weight:800}
.hero p{color:var(--muted);font-size:16.5px;margin:9px 0 0;max-width:780px}
.page-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;gap:8px;justify-content:center;align-items:center;padding:10px 14px;border:1px solid var(--border);border-radius:10px;color:#34405a;background:white;font-size:15.5px;font-weight:800;transition:.15s;white-space:nowrap}
.btn:hover{background:#f0f2fb;border-color:#c7cffa}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:white;box-shadow:0 6px 13px #4958d82a}
.btn.primary:hover{background:var(--indigo-dark)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.small{padding:7px 10px;font-size:14.5px;border-radius:8px}
.btn.danger{color:#ac4150}
.btn .arrow{font-size:19px;line-height:1}
.pill{border-radius:100px;padding:4px 9px;background:#edf0f9;color:#64708a;font-size:13.5px;font-weight:800;white-space:nowrap}
.pill.green{background:var(--good-bg);color:var(--good)}
.pill.yellow{background:var(--warn-bg);color:var(--warn)}
.pill.purple{background:#eef0ff;color:#595aca}
.subtext{font-size:15.5px;color:var(--muted)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;position:relative;overflow:hidden;box-shadow:0 3px 16px #18336b05}
.kpi .kpi-label{font-size:14.5px;color:var(--muted);font-weight:800;letter-spacing:.025em}
.kpi strong{font-size:32px;letter-spacing:-1.2px;font-family:Manrope,sans-serif;font-weight:800;display:block;margin-top:5px;line-height:1.3}
.kpi .kpi-foot{color:#8791a4;font-size:14.5px;margin-top:7px}
.kpi .kpi-symbol{position:absolute;right:19px;top:19px;display:grid;place-items:center;width:29px;height:29px;background:#eef0ff;color:var(--indigo);border-radius:9px;font-size:20px}
.columns{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(300px,1fr);gap:17px}
.columns.equal{grid-template-columns:repeat(2,minmax(0,1fr))}
.columns.left-small{grid-template-columns:minmax(280px,.9fr) minmax(0,1.6fr)}
.stack{display:flex;flex-direction:column;gap:17px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 3px 14px #18336b05;min-width:0;overflow:hidden}
.card.pad{padding:24px}
.card-head{padding:20px 23px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:15px}
.card-head .h-title{font-weight:800;font-size:18px;letter-spacing:-.25px}
.card-head .h-desc{margin-top:3px;font-size:14.5px;color:var(--muted)}
.card-body{padding:21px 23px}
.card-foot{padding:14px 23px;border-top:1px solid var(--border);background:#fafbfe}
.section-title{font-family:Manrope,sans-serif;font-size:20px;font-weight:800;letter-spacing:-.5px;margin:0 0 13px}
.section-caption{color:var(--muted);font-size:15.5px;margin:-5px 0 17px}
.step-label{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;color:#63718b;margin-bottom:15px;text-transform:uppercase;letter-spacing:.08em}
.step-num{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;background:#ebedff;color:var(--indigo);border-radius:7px}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;color:#66728a;font-size:14.5px;font-weight:700;margin-bottom:6px}
.text-input,.select-input,.search-input{border:1px solid #d7deeb;background:#fff;color:var(--ink);border-radius:10px;height:46px;width:100%;padding:0 12px;min-width:0;transition:border .15s}
.text-input:focus,.select-input:focus,.search-input:focus{border-color:#a5affd}
.field-hint{font-size:13.5px;color:#97a1b4;margin-top:4px}
.model-list{display:flex;flex-direction:column;gap:9px}
.model-row{display:flex;gap:11px;align-items:center}
.item-index{height:37px;width:37px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:#eff1fc;color:#6372c1;font-weight:800;font-size:14.5px}
.model-row .text-input{flex:1}
.model-row .list-meta{font-size:13.5px;color:#8792a6;min-width:70px;text-align:right}
.model-row .icon-btn{border:0;background:transparent;color:#99a4b7;font-size:22px;padding:4px}
.model-row .icon-btn:hover{color:#b93b50}
.mini-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.count-controls{display:flex;gap:7px;align-items:center}
.count-controls .btn{width:28px;height:28px;padding:0;border-radius:8px;font-size:19px}
.count-controls .count{font-size:15.5px;font-weight:800;min-width:20px;text-align:center}
.details{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-top:10px;background:#fff}
.details summary{padding:14px 17px;cursor:pointer;color:#37445f;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none}
.details summary::-webkit-details-marker{display:none}
.details summary:after{content:'+';font-size:20px;color:#7d89a1}
.details[open] summary:after{content:'−'}
.details[open] summary{border-bottom:1px solid var(--border)}
.details-content{padding:16px 17px}
.inline-note{display:flex;gap:10px;align-items:flex-start;background:#f6f8ff;border:1px solid #e4e9fc;color:#5e6a83;font-size:15.5px;border-radius:12px;padding:13px 15px}
.inline-note strong{color:#2c3956}
.inline-note.warning{background:#fff8ec;border-color:#fae9c9;color:#7b6741}
.inline-note.success{background:#effaf6;border-color:#d9f0e5}
.progress-track{height:8px;background:#e9edf8;overflow:hidden;border-radius:20px}
.progress-fill{height:100%;background:linear-gradient(90deg,#6e7bf7,#3dc0bb);border-radius:20px;transition:width .25s}
.block-title{font-size:15.5px;color:#57647f;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.big-number{font:800 43px/1.15 Manrope,sans-serif;letter-spacing:-1.5px}
.intro-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.intro-step{display:flex;align-items:start;gap:11px;font-size:15.5px;color:#65718a}
.intro-step i{font-style:normal;width:22px;height:22px;border-radius:7px;background:#eef0ff;color:var(--indigo);display:grid;place-items:center;flex-shrink:0;font-size:13.5px;font-weight:800}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar .search-input{width:250px}
.toolbar .select-input{width:auto;max-width:240px}
.toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.checkbox-label{display:flex;align-items:center;gap:7px;font-size:15.5px;font-weight:700;color:#61708b;white-space:nowrap}
.checkbox-label input{accent-color:var(--indigo)}
.comparison-list{display:flex;flex-direction:column;gap:9px}
.comp-row{display:grid;grid-template-columns:minmax(0,1fr) 142px;gap:14px;align-items:center;border:1px solid var(--border);border-radius:13px;padding:15px 18px;background:#fff;transition:.15s}
.comp-row:hover{border-color:#cbd1ff;box-shadow:0 2px 8px #4554b50c}
.comp-code{font-weight:800;font-size:13.5px;color:var(--indigo);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.comp-question{font-size:16px;font-weight:700;line-height:1.4;color:#2d3852;overflow-wrap:anywhere}
.comp-question .versus{font-size:13.5px;letter-spacing:.04em;color:#8b96ad;padding:0 5px;text-transform:uppercase;font-weight:800}
.comp-helper{font-size:13.5px;color:#8b95aa;margin-top:5px}
.score-combo{text-align:center}
.score-combo .select-input{height:46px;border-color:#ccd4e7;font-weight:800;text-align:center}
.score-combo .select-input.has-score{color:var(--indigo);background:#f8f9ff;border-color:#ccd0ff}
.score-combo small{font-size:12.5px;color:#9aa5b8;display:block;margin-top:3px}
.empty{border:1px dashed #cbd4e7;border-radius:13px;padding:32px 18px;text-align:center;color:#7e8aa0}
.empty strong{display:block;color:#3f4b65;margin-bottom:5px}
.group-title{font-size:15.5px;font-weight:800;margin-top:17px;margin-bottom:8px;color:#526078}
.bar-list{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(70px,2fr) 66px;align-items:center;gap:13px}
.bar-row .bar-name{color:#38445e;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar-bg{height:9px;border-radius:30px;background:#eef1fa;overflow:hidden}
.bar-row .bar-fill{height:100%;border-radius:30px;background:linear-gradient(90deg,#828aff,#5863e4)}
.bar-row:nth-child(2n) .bar-fill{background:linear-gradient(90deg,#51c8b6,#199ca0)}
.bar-row .bar-value{text-align:right;font:800 15.5px Manrope,sans-serif;color:#404e6a}
.ranking-box{padding:14px 16px;border:1px solid #e8ecf5;border-radius:11px;margin-bottom:10px}
.ranking-box:last-child{margin-bottom:0}
.ranking-box .rank-row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.rank-number{color:#8b98ae;font-weight:800;min-width:25px}
.rank-label{font-size:15.5px;color:#37415b;font-weight:700;flex:1}
.rank-weight{font-weight:800;font-size:15.5px;color:#4659c9}
.metrics-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ecf0f7;font-size:15.5px;gap:15px}
.metrics-line:last-child{border-bottom:0}
.metrics-line span{color:#65738b}
.metrics-line b{font-family:Manrope,sans-serif;font-size:16px}
.segmented{display:flex;flex-wrap:wrap;gap:5px}
.seg{border:1px solid #dce2ef;background:white;padding:8px 12px;font-size:15.5px;font-weight:800;color:#65728a;border-radius:8px;min-width:39px}
.seg.active{color:white;background:var(--indigo);border-color:var(--indigo)}
.chart-wrap{width:100%;overflow:auto;min-height:205px}
.svg-chart{width:100%;min-width:530px;height:auto;display:block}
.chart-legend{font-size:14.5px;color:#69758d;display:flex;gap:18px;align-items:center;margin-top:6px}
.chart-key{height:9px;width:9px;background:var(--indigo);border-radius:50%;display:inline-block;margin-right:6px}
.chart-key.alt{background:#d7ddef}
.matrix-scroll{width:100%;overflow-x:auto;padding-bottom:4px}
.matrix{border-collapse:separate;border-spacing:3px;width:100%;min-width:850px;font-size:13.5px;table-layout:fixed}
.matrix th{padding:8px 4px;color:#63708a;font-size:13.5px;font-weight:800;white-space:nowrap}
.matrix td{padding:9px 3px;border-radius:6px;text-align:center;font-variant-numeric:tabular-nums;color:#394463;border:1px solid #e7eaf4;background:#fafbfe;font-weight:700}
.matrix td.diagonal{color:#a7b0c4;background:#f1f3f8}
.matrix td.missing{color:#b9c2d2;background:#f8f9fc}
.matrix .row-header{text-align:left;max-width:85px}
.matrix .focus-cell{background:#e0e7ff;color:#3745a8;border-color:#c7d4ff}
.grid-table{border-collapse:collapse;width:100%;min-width:840px;text-align:right;font-size:14.5px;font-variant-numeric:tabular-nums}
.grid-table th,.grid-table td{border-bottom:1px solid #e8ecf4;padding:10px 11px;white-space:nowrap}
.grid-table th{font-size:13.5px;color:#64728b;background:#f9fafe;font-weight:800}
.grid-table th:first-child,.grid-table td:first-child{text-align:left;position:sticky;left:0;background:white;font-weight:800;min-width:124px;z-index:1}
.grid-table td{color:#50607a}
.grid-table td.highlight{color:#3d4dd7;font-weight:800;background:#eef0ff}
.grid-table tfoot td{font-weight:800;background:#f8fafc}
.data-table-wrap{overflow:auto;border-radius:11px;border:1px solid var(--border)}
.data-table-wrap .grid-table th:first-child{background:#f9fafe}
.detail-value{font:800 30px Manrope,sans-serif;color:#283553;letter-spacing:-.8px}
.legend-bar{display:inline-block;width:26px;height:7px;border-radius:20px;background:linear-gradient(90deg,#eef2fd,#778bf1);margin-right:4px}
.footer-note{margin-top:30px;border-top:1px solid var(--border);padding-top:15px;display:flex;align-items:center;justify-content:space-between;gap:14px;color:#9aa5b8;font-size:14.5px;flex-wrap:wrap}
.toast{position:fixed;right:25px;bottom:22px;z-index:100;background:#27354e;color:white;padding:12px 16px;border-radius:11px;box-shadow:0 12px 35px #101a2b2d;font-size:15.5px;font-weight:700;max-width:360px}
.hidden-file{display:none}
.mobile-top{display:none}
@media(max-width:1150px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.columns,.columns.equal,.columns.left-small{grid-template-columns:minmax(0,1fr)}.sidebar{width:238px}.shell{grid-template-columns:238px minmax(0,1fr)}}
@media(max-width:760px){.shell{display:block}.sidebar{position:relative;width:100%;height:auto;padding:13px 14px;display:block}.brand{padding:0 3px 13px;border:0}.brand small{display:none}.sidebar-label,.sidebar-foot,.sidebar-spacer{display:none}.nav{display:flex;overflow-x:auto;flex-direction:row;gap:5px;white-space:nowrap;padding-bottom:3px}.nav button{width:auto;flex-shrink:0;padding:9px 12px;font-size:14.5px}.nav button .nav-glyph{display:none}.topbar{padding:11px 16px}.content{padding:25px 17px 60px}.hero{flex-direction:column;gap:14px}.hero h1{font-size:31px}.kpi-grid{gap:10px}.kpi{padding:14px}.kpi strong{font-size:29px}.card-head,.card-body{padding:17px}.card.pad{padding:17px}.field-grid{grid-template-columns:1fr}.toolbar .search-input{width:100%}.toolbar .select-input{max-width:100%;flex:1}.toolbar .right{margin-left:0}.comp-row{grid-template-columns:minmax(0,1fr) 84px;padding:12px}.comp-question{font-size:15.5px}.score-combo .select-input{padding:0 4px}.bar-row{grid-template-columns:minmax(0,1.2fr) minmax(50px,1fr) 55px}.bar-row .bar-name{font-size:13.5px}.hero p{font-size:15.5px}.topactions [data-action="download-project"]{display:none}}
@media print{.sidebar,.topbar,.btn,.toolbar,.footer-note,.toast{display:none!important}.shell{display:block}.content{max-width:none;padding:8px}.card,.kpi{box-shadow:none;break-inside:avoid}.hero h1{font-size:29px}}
/* Step 2 panels, data entry and sensitivity heatmaps */
.compact{height:42px;min-width:105px;padding:4px 9px;font-size:14.5px;border-radius:7px}
.number-input{width:108px;min-width:70px}
.tiny-number{width:64px;min-width:56px;text-align:center}
.short-text{font-size:14.5px;color:#4957a5}
.paste-area{display:block;width:100%;min-height:136px;resize:vertical;border:1px solid #d8dfed;padding:13px;border-radius:11px;background:#fdfdff;color:var(--ink);font-size:15.5px;line-height:1.6}
.table-sub{color:#8995a9;font-size:13.5px;font-weight:500;margin-top:3px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.light-cell{color:#8592a9!important;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.range-control{display:flex;gap:12px;align-items:center;min-width:165px}
.range-control input{width:125px;accent-color:var(--indigo);cursor:pointer}
.range-control strong{display:grid;place-items:center;width:25px;height:25px;background:#eff1ff;color:#4b56c7;font-size:15.5px;border-radius:6px}
.heat-table{min-width:1120px;text-align:center}
.heat-table th:not(:first-child),.heat-table td:not(:first-child){padding:5px;min-width:70px;text-align:center}
.heat-table .heat-cell{display:flex;align-items:center;justify-content:center;border-radius:6px;height:42px;min-width:70px;padding:5px;font-size:13.5px;font-weight:800;color:#30406a}
.heat-table .null{color:#a4aec0}
.grid-table .summary-row td{background:#f1f3fd!important;color:#3b4aa2;font-weight:800;border-top:2px solid #d8dffa}
.grid-table td .mini-flex{flex-wrap:nowrap}
.grid-table td .mini-flex .btn{flex-shrink:0}
.grid-table .row-number{font-size:13.5px;font-weight:800;color:#99a5b8}
.grid-table td input{font-variant-numeric:tabular-nums}
.grid-table td input:focus{background:#fff}
.eyebrow + h1{overflow-wrap:anywhere}
@media(max-width:940px){.range-control{min-width:140px}.range-control input{width:95px}}
@media(max-width:760px){.range-control{min-width:120px}.range-control input{width:85px}.grid-table th,.grid-table td{padding:8px 9px}.short-text{max-width:110px!important}.btn{white-space:normal}.model-row .text-input{min-width:0}}

/* Larger default type: ensure navigation remains reachable on short screens. */
@media(min-width:761px){.sidebar .nav{min-height:0;overflow-y:auto;overflow-x:hidden;flex-shrink:1}.sidebar .nav::-webkit-scrollbar{width:5px}.sidebar .nav::-webkit-scrollbar-thumb{background:#8292b866;border-radius:6px}}

function focusGraphic(data){

 const ex=data.normalized.map(row=>row.map(v=>sd>0?Math.max(0,(v-data.meanNormalized)/sd-1):0));
 const totals=data.items.map((_,c)=>sum(ex.map(row=>row[c])));
 const mx=Math.max(.2,...totals)*1.10;
 const W=900,L=55,R=26,T=24,B=245,H=211,plotW=W-L-R,dx=plotW/n;
 const grid=[0,.25,.5,.75,1].map(t=>`<g><line x1="${L}" y1="${(B-t*H).toFixed(1)}" x2="${W-R}" y2="${(B-t*H).toFixed(1)}" stroke="#e8ecf5"/><text x="${L-7}" y="${(B-t*H+4).toFixed(1)}" text-anchor="end" fill="#768198" font-size="11.5">${(t*mx).toFixed(1)}</text></g>`).join('');
 const bars=data.items.map((column,c)=>{
  const x=L+c*dx+dx*.14,w=dx*.72,cx=L+(c+.5)*dx;let current=B;

   return `<g><title>${esc(column.name)} · source row ${esc(row.name)}: ${v.toFixed(3)} standard deviations beyond the +1 cutoff</title><rect x="${x.toFixed(1)}" y="${y.toFixed(2)}" width="${w.toFixed(1)}" height="${Math.max(h,0).toFixed(2)}" fill="${chartColors[r%chartColors.length]}"/></g>`;
  }).join('');
  return `<g>${segments}<text x="${cx.toFixed(1)}" y="${B+20}" font-size="12" fill="#52617a" text-anchor="middle">${c+1}</text></g>`;
 }).join('');

 return `<div class="csahp-chart-wrap"><svg viewBox="0 0 ${W} 294" role="img" aria-label="Focus beyond one standard deviation for ${esc(data.name)}" class="csahp-chart"><title>Focus beyond one standard deviation for ${esc(data.name)}</title>${grid}${bars}<text x="${L}" y="16" font-size="12" fill="#53617a">Excess beyond +1 standard deviation</text><text x="${W-R}" y="${B+40}" text-anchor="end" font-size="11" fill="#6e7b91">Normalized column</text></svg></div><div class="csahp-chart-stat"><b>${active} of ${n}</b> columns have at least one normalized entry above the +1 SD cutoff. The stacked bars show only the amount beyond that cutoff.${!data.full?' <span class="csahp-preview">Unanswered comparisons are neutral previews.</span>':''}</div><details class="csahp-focus-legend"><summary>Show source rows and column labels</summary>${chartLegend(data.items)}</details>`;

function csvCell(x){const s=String(x??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function csv(rows){return rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n';}
function csvParse(txt,delimiter){
 if(!delimiter){const line=String(txt).split(/\r?\n/,1)[0];delimiter=line.split('\t').length>line.split(',').length?'\t':',';}
 let out=[],row=[],field='',quoted=false;
 for(let i=0;i<txt.length;i++){
  const c=txt[i];if(c==='"'){if(quoted&&txt[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}else if(c===delimiter&&!quoted){row.push(field);field='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))out.push(row);row=[];field='';}else field+=c;
 }
 row.push(field);if(row.some(x=>x!==''))out.push(row);return out;
}

   const obj=Object.fromEntries(heads.map((k,i)=>[k,r[i]?.trim()]));const name=(obj[personKey]||'Individual').trim();

 wb.querySelectorAll('sheets > sheet').forEach(sheet=>{
  const name=sheet.getAttribute('name'),rid=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  let target=map[rid];if(!target)return;target=target.startsWith('/')?target.slice(1):'xl/'+target.replace(/^\.\//,'').replace(/^\.\.\//,'');
  if(!files.has(target))return;
  const root=xml(files.get(target)),cells={};
  root.querySelectorAll('sheetData row c').forEach(c=>{
   const ref=c.getAttribute('r'),type=c.getAttribute('t'),v=c.querySelector('v')?.textContent;
   let value=v;
   if(type==='s'&&v!=null)value=strings[Number(v)];
   if(type==='inlineStr')value=[...c.querySelectorAll('is t')].map(x=>x.textContent).join('');
   if(value!=null&&value!=='')cells[ref]=value;
  });
  sheets[name.toLowerCase().trim()]=cells;
 });
 return sheets;
}
function importedFromRawModel(sheets,filename){
 const raw=sheets['raw model'];if(!raw)return 0;
 const person=sheets['import sheet (paste survey)']?.B2||filename.replace(/\.xlsx$/i,'');
 const result={name:person,criteria:[],perspectives:[]};
 for(let i=0;i<10;i++){
  const col=String.fromCharCode(65+i*2),weightCol=String.fromCharCode(66+i*2);
  const p=raw[col+'1'],weight=Number(raw[weightCol+'1']);
  if(!p)continue;
  const target=state.model.perspectives.find(x=>slug(x.name)===slug(p));
  if(target&&Number.isFinite(weight))result.perspectives.push({id:target.id,name:p,weight});
  for(let r=2;r<=14;r++){
   const crit=raw[col+r],local=Number(raw[weightCol+r]);
   if(!crit||!Number.isFinite(local)||local<0)continue;
   const c=findCriterion({criterion:crit,perspective:p});
   if(c)result.criteria.push({id:c.id,name:crit,short:c.short,perspective:p,globalWeight:local*weight});
  }
 }
 if(!result.criteria.length)throw Error('The Raw Model tab had no matching criterion weights.');
 state.members.push(toMember(result,result.name,state.ui.panel,filename+' · Raw Model'));
 return 1;
}
function importedFromWideSheet(sheets,filename){
 const key=Object.keys(sheets).find(x=>x.includes('model results import'));
 if(!key)return 0;
 const cells=sheets[key],rows=[];
 // Original uploaded Step 2 workbook layout: A = perspective short name,
 // B = criterion full name, C:N = Expert 1 through Expert 12 LOCAL priorities.
 // Panel 1 Score D holds the assigned perspective weights. Import each
 // nonempty expert column as an independent Step 1+2 result (not pasted text).
 if(String(cells.A1||'').toLowerCase().includes('short name for perspective')&&
    /^expert/i.test(String(cells.C1||''))){
  const panel=sheets['panel 1 score']||{};
  const perspectiveWeight={};
  for(let r=2;r<=12;r++){
   const short=slug(panel['A'+r]||''),name=slug(panel['C'+r]||'');
   if(!short&&!name)continue; // Exclude the workbook's unlabeled total/summary cells.
   const w=Number(panel['D'+r]);
   const p=state.model.perspectives.find(x=>slug(x.name)===name||slug(x.short)===short||slug(x.name).startsWith(short));
   if(p&&Number.isFinite(w)&&w>0)perspectiveWeight[p.id]=w;
  }
  const validExperts=[];
  for(let i=3;i<=14;i++){
   let j=i,col='';while(j){j--;col=String.fromCharCode(65+j%26)+col;j=Math.floor(j/26);}
   const person=String(cells[col+'1']||'').trim();if(!/^expert\s+\d+/i.test(person))continue;
   const scores=[],perspectives=[];
   state.model.perspectives.forEach(p=>{if(perspectiveWeight[p.id]>0)perspectives.push({id:p.id,name:p.name,weight:perspectiveWeight[p.id]});});
   for(let r=2;r<=1000;r++){
    const cname=String(cells['B'+r]||'').trim();if(!cname)continue;
    const c=findCriterion({criterion:cname});
    const value=cells[col+r];if(value==null||String(value).trim()===''||!c)continue;
    const local=Number(value),pw=perspectiveWeight[c.perspectiveId];
    if(!Number.isFinite(local)||local<0||!Number.isFinite(pw)||pw<=0)continue;
    scores.push({id:c.id,name:c.name,short:c.short,perspective:c.perspective,localWeight:local,globalWeight:local*pw});
   }
   if(scores.length)validExperts.push(toMember({name:person,criteria:scores,perspectives},person,state.ui.panel,filename+' · Model Results Import'));
  }
  if(validExperts.length){state.members.push(...validExperts);return validExperts.length;}
  throw Error('No expert criterion scores matched the Step 1 model names in the source workbook.');
 }
 for(let r=1;r<=1000;r++){
  const row=[];let any=false;
  for(let c=0;c<36;c++){
   let x=c+1,label='';while(x){x--;label=String.fromCharCode(65+x%26)+label;x=Math.floor(x/26);}
   const val=cells[label+r]||'';row.push(val);if(val)any=true;
  }
  if(any)rows.push(row);
 }
 for(let i=0;i<Math.min(rows.length,20);i++){
  if(rows[i].some(x=>['short_name','short name','criterion','criteria','name'].includes(String(x).toLowerCase().trim()))){
   const n=importCSV(csv(rows.slice(i)),filename+' · Model Results Import');if(n)return n;
  }
 }
 throw Error('Model Results Import tab was found but its header layout did not match a supported score table. Import a supported CSV export with criterion names and participant weights.');
}
async function loadInputFiles(files){
 let added=0,failed=[];
 for(const f of files){
  try{
   const ext=f.name.split('.').pop().toLowerCase();
   if(ext==='json')added+=await importJSON(await f.text(),f.name);
   else if(ext==='csv'||ext==='tsv')added+=importCSV(await f.text(),f.name);
   else if(ext==='xlsx'){
    const wb=xlsxSheets(await unzipXLSX(await f.arrayBuffer()));
    added+=importedFromRawModel(wb,f.name)||importedFromWideSheet(wb,f.name);
   }else throw Error('Unsupported format');
  }catch(e){failed.push(f.name+': '+e.message);}
 }
 persist();render();
 if(added)toast(added+' participant(s) imported into '+state.ui.panel+'.');
 if(failed.length){toast(failed.join(' · ').slice(0,320),true);console.warn('Import issues:',failed);}
}
function bindEvents(){
 // Keep the 100-point matrix efficient for keyboard entry: Tab/Shift+Tab saves
 // the current cell and advances without losing one's position to a re-render.
 document.addEventListener('keydown',e=>{
  if(e.key!=='Tab'||!e.target.matches('input[data-action="s100-pair"]'))return;
  e.preventDefault();
  const inputs=[...document.querySelectorAll('input[data-action="s100-pair"]')];
  const at=inputs.indexOf(e.target),next=at+(e.shiftKey?-1:1);
  onChange(e.target);
  const after=[...document.querySelectorAll('input[data-action="s100-pair"]')];
  if(after[next]){after[next].focus();after[next].select();}
 });
 document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA')return;
  doClick(el.dataset.action,el.dataset,el);
 });
 document.addEventListener('change',e=>{
   if(e.target.id==='section-import-file'){sectionImport(e.target.dataset.section,[...e.target.files]);return;}
  if(e.target.id==='import-files'){loadInputFiles([...e.target.files]);return;}
  if(e.target.id==='project-file'){const f=e.target.files[0];if(f)f.text().then(text=>importJSON(text,f.name).then(()=>{persist();render();toast('Project loaded.');}).catch(err=>toast(err.message,true)));return;}
  onChange(e.target);
 });
 document.addEventListener('input',e=>{
  const action=e.target.dataset.action;
  if(['final-query','compare-query'].includes(action))onChange(e.target,true);
 });
}
initialize();bindEvents();render();
window.CONSTANT_SUM_AHP_APP_TEST = window.HDM_APP_TEST = {state:()=>state,calc,panelCalc,currentIndividual,importCSV,csvParse,scale100Calc:(scope)=>SCALE100.calc(state,scope),scale100Export:()=>SCALE100.exportCSV(state),matrixDiagnostics,scenarioByPerspective:(perspectiveId)=>scenarioByPerspective(panelCalc(),perspectiveId)};
})();
